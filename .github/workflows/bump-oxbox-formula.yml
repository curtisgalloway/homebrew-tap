# Re-pin Formula/oxbox.rb to an oxbox release tag.
#
# Fired automatically by oxbox's release workflow via repository_dispatch
# (event_type: oxbox-release, client_payload.tag = vX.Y.Z) once a Release is
# published. Also runnable by hand (workflow_dispatch) with an optional tag —
# omit it to pin whatever oxbox's latest release is.
#
# Like the paniolo pipeline: oxbox's release publishes prebuilt tarballs
# (macOS universal, Linux amd64, Linux arm64) with sha256 sidecars, and the
# formula pours them, so the bump is scripts/repin.sh with REPIN_PROJECT=oxbox.

name: Bump oxbox formula

on:
  repository_dispatch:
    types: [oxbox-release]
  workflow_dispatch:
    inputs:
      tag:
        description: "oxbox release tag to pin (e.g. v0.1.0); default = latest"
        required: false

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      # ref: main, not the default github.sha — for a repository_dispatch the
      # event SHA is main's tip at dispatch time, which can already be behind.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main

      - name: Resolve target tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          tag="${DISPATCH_TAG:-$INPUT_TAG}"
          if [ -z "$tag" ]; then
            tag=$(gh release view --repo curtisgalloway/oxbox --json tagName -q .tagName)
          fi
          case "$tag" in
            v[0-9]*) ;;
            *) echo "::error::Unexpected tag '$tag' (want vX.Y.Z)"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Re-pin the formula
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          REPIN_PROJECT: oxbox
        run: scripts/repin.sh "$TAG"

      # Best effort, as in bump-formula.yml: a runner without brew skips.
      - name: brew style (best effort)
        run: |
          if ! command -v brew >/dev/null 2>&1; then
            echo "::notice::Homebrew not installed on this runner; skipping brew style."
            exit 0
          fi
          brew style Formula/oxbox.rb

      - name: Commit the re-pin
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- Formula/oxbox.rb; then
            echo "Formula already pins ${VERSION} — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "oxbox ${VERSION}: re-pin formula (automated)" -- Formula/oxbox.rb
          # Explicit token URL for the same reason as the paniolo workflow:
          # the ephemeral GITHUB_TOKEN, auto-masked, not persisted to config.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
