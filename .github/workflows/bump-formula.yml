# Re-pin Formula/paniolo.rb to a paniolo release tag.
#
# The formula is a binary formula: it pours the release's prebuilt tarballs
# (see Formula/paniolo.rb), so the whole bump is one job — resolve the tag,
# run scripts/repin.sh, commit, push. There is no source build, no bottle to
# compile, and nothing to merge back in, unlike the three-job
# bump/bottle/merge pipeline this replaced (see git history and
# scripts/repin.sh for why: repin.sh downloads each asset's `.sha256`
# sidecar rather than hashing a source tarball, and refuses to touch the
# formula if a release is missing one).
#
# Fired automatically by paniolo's release workflow via repository_dispatch
# (event_type: paniolo-release, client_payload.tag = vX.Y.Z) once a Release
# is published. Also runnable by hand (workflow_dispatch) with an optional
# tag — omit it to pin whatever paniolo's latest release is.

name: Bump paniolo formula

on:
  repository_dispatch:
    types: [paniolo-release]
  workflow_dispatch:
    inputs:
      tag:
        description: "paniolo release tag to pin (e.g. v0.1.18); default = latest"
        required: false

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # ref: main, not the default github.sha — for a repository_dispatch the
      # event SHA is main's tip at dispatch time, which can already be behind.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main

      - name: Resolve target tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          tag="${DISPATCH_TAG:-$INPUT_TAG}"
          if [ -z "$tag" ]; then
            tag=$(gh release view --repo curtisgalloway/paniolo --json tagName -q .tagName)
          fi
          case "$tag" in
            v[0-9]*) ;;
            *) echo "::error::Unexpected tag '$tag' (want vX.Y.Z)"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Re-pin the formula
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: scripts/repin.sh "$TAG"

      # Best-effort: most runners here won't have Homebrew installed (this
      # job no longer needs it for anything else, unlike the old bottle
      # job), so a missing `brew` just skips rather than failing the bump.
      # `brew audit` refuses a bare path ("Calling `brew audit [path ...]`
      # is disabled") — it needs the formula resolvable through a tap, which
      # a plain checkout isn't, so only `brew style` (which takes a path)
      # runs here. A maintainer can run the real audit locally against a
      # tapped clone: `brew audit --strict --formula curtisgalloway/tap/paniolo`
      # (see AGENTS.md).
      - name: brew style (best effort)
        run: |
          if ! command -v brew >/dev/null 2>&1; then
            echo "::notice::Homebrew not installed on this runner; skipping brew style."
            exit 0
          fi
          brew style Formula/paniolo.rb

      - name: Commit the re-pin
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- Formula/paniolo.rb; then
            echo "Formula already pins ${VERSION} — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "paniolo ${VERSION}: re-pin formula (automated)" -- Formula/paniolo.rb
          # Push to an explicit token URL: bare `git push` needs an upstream,
          # and the ephemeral GITHUB_TOKEN is auto-masked in logs and isn't
          # persisted to .git/config (passed straight to push).
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
